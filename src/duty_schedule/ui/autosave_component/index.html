<!doctype html><html lang="ru"><meta charset="utf-8"><body style="margin:0;font:14px sans-serif;color:CanvasText;color-scheme:light dark">
<div id="status" role="status">Сохранение идёт…</div>
<script>
const label=document.getElementById('status');
const lastKey='duty-schedule:last';
let sent='',dirty=false,lastHash,ownToken;
function send(data){const serialized=JSON.stringify(data);if(serialized===sent)return;sent=serialized;parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:data},'*');}
function record(raw){const data=JSON.parse(raw);if(data.version!==1||typeof data.token!=='string'||typeof data.project!=='string')throw Error('Повреждённая или неподдерживаемая запись');JSON.parse(data.project);return data;}
window.addEventListener('message',async event=>{
 if(event.source!==parent)return;
 if(event.data.type!=='streamlit:render')return;
 const theme=event.data.theme;
 if(theme){document.body.style.color=theme.textColor;document.body.style.backgroundColor=theme.backgroundColor;}
 const args=event.data.args;
 if(lastHash!==args.hash){dirty=false;lastHash=args.hash;}
 try{
  if(args.phase==='read'){
   const id=localStorage.getItem(lastKey),raw=id&&localStorage.getItem('duty-schedule:project:'+id);
   if(raw){
    let data,recovered=false;
    try{data=record(raw);}catch(error){
     const backup=localStorage.getItem('duty-schedule:project:'+id+':previous');
     if(!backup)throw error;
     data=record(backup);recovered=true;
    }
    label.textContent=recovered?'Восстановлена резервная версия':'Восстановление проекта…';
    send({status:'restore',project:data.project,token:data.token,recovered});
   }
   else send({status:'empty'});
   return;
  }
  if(args.blocked){label.textContent='Ошибка сохранения; доступна резервная копия';return;}
  const key='duty-schedule:project:'+args.project_id;
  if(!navigator.locks)throw Error('Браузер не поддерживает безопасное сохранение из двух вкладок');
  await navigator.locks.request(key,()=>{
  const raw=localStorage.getItem(key);
  let current=raw?record(raw):null;
  if(current&&current.project===args.project){localStorage.setItem(lastKey,args.project_id);label.textContent=dirty?'Есть неприменённые правки формы':'Сохранено в этом браузере';send({status:'saved',token:current.token,hash:args.hash});return;}
  if(current&&current.token!==args.expected_token&&current.token!==ownToken){label.textContent='Конфликт: другая вкладка сохранила новую версию';send({status:'conflict',token:current.token,hash:args.hash});return;}
  label.textContent='Сохранение идёт…';
  const next={version:1,token:crypto.randomUUID(),project:args.project};
  if(raw)localStorage.setItem(key+':previous',raw);
  localStorage.setItem(key,JSON.stringify(next));
  ownToken=next.token;
  localStorage.setItem(lastKey,args.project_id);
  label.textContent=dirty?'Есть неприменённые правки формы':'Сохранено в этом браузере';
  send({status:'saved',token:next.token,hash:args.hash});
  });
 }catch(error){label.textContent='Ошибка сохранения: '+error.message;send({status:'error',error:error.message,hash:args.hash});}
});
try {parent.document.addEventListener('input',event=>{if(event.target.closest('form,[data-testid="stForm"]')){dirty=true;label.textContent='Есть неприменённые правки формы';}},true);}catch(error){}
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:35},'*');
</script></body></html>
