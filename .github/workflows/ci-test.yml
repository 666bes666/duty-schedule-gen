name: CI Test (Thorough)

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format --check src/ tests/ scripts/
      - run: uv run mypy src/ scripts/

  test-matrix:
    name: Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python }}
          extras: solver
      - run: uv run pytest tests/unit tests/integration tests/contract -q --cov=duty_schedule --cov-report=xml --cov-fail-under=80
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  solver-tests:
    name: Required Solver
    uses: ./.github/workflows/solver-tests.yml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          extra-groups: ci-security
      - run: uv run pip-audit
      - run: uv run bandit -r src/ -c pyproject.toml

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          extra-groups: ci-perf
          extras: solver
      - name: Restore previously successful benchmark baseline
        id: bench-cache
        uses: actions/cache/restore@v4
        with:
          path: .benchmarks/
          key: benchmark-v2-${{ runner.os }}-py312-${{ github.sha }}
          restore-keys: benchmark-v2-${{ runner.os }}-py312-
      - name: Compare restored baseline and run benchmarks
        env:
          DUTY_CURRENT_SHA: ${{ github.sha }}
          DUTY_MATCHED_KEY: ${{ steps.bench-cache.outputs.cache-matched-key }}
        run: |
          duty_benchmark_args=(--benchmark-save=baseline --benchmark-min-rounds=2 --benchmark-max-time=15)
          if [ -n "$DUTY_MATCHED_KEY" ]; then
            DUTY_PREVIOUS_BENCHMARK=$(uv run python scripts/benchmark_baseline.py .benchmarks --current-sha "$DUTY_CURRENT_SHA")
            if [ -n "$DUTY_PREVIOUS_BENCHMARK" ]; then
              duty_benchmark_args+=(--benchmark-compare="$DUTY_PREVIOUS_BENCHMARK" --benchmark-compare-fail=mean:10%)
            fi
          fi
          uv run pytest tests/performance -q --benchmark-only "${duty_benchmark_args[@]}"
      - name: Retain candidate after successful comparison
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-candidate
          path: .benchmarks/
          include-hidden-files: true

  streamlit-smoke:
    name: Streamlit Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/streamlit-smoke

  promote-benchmark:
    name: Promote Verified Benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: [lint, test-matrix, security, solver-tests, performance, streamlit-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-candidate
          path: .benchmarks/
      - uses: actions/cache/save@v4
        with:
          path: .benchmarks/
          key: benchmark-v2-${{ runner.os }}-py312-${{ github.sha }}
