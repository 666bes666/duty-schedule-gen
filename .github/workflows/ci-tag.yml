name: Tag Verified Version

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Create tag for verified SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
        with:
          dev-deps: "false"
      - name: Validate or create tag
        env:
          DUTY_VERIFIED_SHA: ${{ inputs.source-sha }}
          DUTY_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          DUTY_TAG="v$DUTY_RELEASE_VERSION"
          if DUTY_EXISTING_SHA=$(git rev-parse -q --verify "refs/tags/${DUTY_TAG}^{commit}"); then
            uv run python scripts/artifact_manifest.py tag --sha "$DUTY_VERIFIED_SHA" --version "$DUTY_RELEASE_VERSION" --existing-sha "$DUTY_EXISTING_SHA"
          else
            uv run python scripts/artifact_manifest.py tag --sha "$DUTY_VERIFIED_SHA" --version "$DUTY_RELEASE_VERSION"
            git tag "$DUTY_TAG" "$DUTY_VERIFIED_SHA"
            git push origin "refs/tags/$DUTY_TAG"
          fi
