name: Required Solver Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  solver:
    name: CP-SAT without skips
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          extras: solver
      - name: Require installed CP-SAT
        run: uv run python -c "from ortools.sat.python import cp_model; print(cp_model.CpSolver())"
      - name: Exercise solver and mandatory planning rules
        run: uv run pytest tests/unit/test_solver.py tests/unit/test_planning_rules.py tests/unit/test_search_outcomes.py tests/unit/test_delivery_workflows.py::test_packaged_smoke_payload_generates_ready -q --junitxml=solver-results.xml
      - name: Reject skips or empty selection
        run: uv run python scripts/check_junit.py solver-results.xml
