name: Release Verified Artifact

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish previously tested distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          dev-deps: "false"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
      - name: Verify source, version and exact tested bytes
        env:
          DUTY_VERIFIED_SHA: ${{ inputs.source-sha }}
          DUTY_RELEASE_VERSION: ${{ inputs.version }}
        run: uv run python scripts/artifact_manifest.py verify --sha "$DUTY_VERIFIED_SHA" --version "$DUTY_RELEASE_VERSION"
      - name: Inspect existing release
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUTY_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          DUTY_IS_DRAFT=$(gh release view "v$DUTY_RELEASE_VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          echo "published=$([ "$DUTY_IS_DRAFT" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        if: steps.state.outputs.published != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Create verified draft release
        if: steps.state.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ inputs.source-sha }}
          name: v${{ inputs.version }}
          body_path: CHANGES.md
          draft: true
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
            dist/artifact-manifest.json
      - name: Publish verified release
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUTY_RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v$DUTY_RELEASE_VERSION" --draft=false
