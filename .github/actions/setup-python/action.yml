name: Setup Python with uv
description: Install Python via uv, sync locked dependencies

inputs:
  python-version:
    description: Python version to install
    default: "3.12"
  dev-deps:
    description: Install dev dependencies
    default: "true"
  extra-groups:
    description: Additional dependency groups (comma-separated)
    default: ""
  extras:
    description: Optional dependency extras (comma-separated)
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v3
    - run: uv python install "$DUTY_PYTHON_VERSION"
      shell: bash
      env:
        DUTY_PYTHON_VERSION: ${{ inputs.python-version }}
    - run: |
        duty_uv_args=(--frozen)
        if [ "$DUTY_DEV_DEPS" = "true" ]; then
          duty_uv_args+=(--dev)
        else
          duty_uv_args+=(--no-dev)
        fi
        IFS=',' read -ra duty_groups <<< "$DUTY_EXTRA_GROUPS"
        for duty_group in "${duty_groups[@]}"; do
          if [ -n "$duty_group" ]; then
            duty_uv_args+=(--group "$duty_group")
          fi
        done
        IFS=',' read -ra duty_extras <<< "$DUTY_EXTRAS"
        for duty_extra in "${duty_extras[@]}"; do
          if [ -n "$duty_extra" ]; then
            duty_uv_args+=(--extra "$duty_extra")
          fi
        done
        uv sync "${duty_uv_args[@]}"
      shell: bash
      env:
        DUTY_DEV_DEPS: ${{ inputs.dev-deps }}
        DUTY_EXTRA_GROUPS: ${{ inputs.extra-groups }}
        DUTY_EXTRAS: ${{ inputs.extras }}
